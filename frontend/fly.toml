# fly.toml app file generated for WanderPath web
app = "wanderpath-web-emen"
primary_region = "ams"

[build]
  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "https://wanderpath-api-emen.fly.dev"

[env]
  PORT = "8080"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
